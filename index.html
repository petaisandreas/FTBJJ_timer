<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FT BJJ Timer</title>
<meta name="description" content="Round timer for FT BJJ Limassol: rounds, rest and sound cues.">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FT BJJ">
</head>
<body>
<style>
  /* FT BJJ Limassol: ασπρόμαυρο σαν το λογότυπο και το Instagram του συλλόγου,
     γωνιακά σχήματα σαν την ασπίδα του λογότυπου. */
  :root {
    --accent: #ffffff;        /* Start, ενεργός γύρος, κουκκίδες */
    --accent-dark: #cfcfcf;   /* hover του Start */
    --accent-deep: #6a6a6a;   /* γύροι που τελείωσαν */
    --accent-text: #0a0a0a;   /* κείμενο πάνω στο --accent */
    --bg: #0a0a0a;
    --panel: #121212;
    --line: #262626;
    --muted: #7a7a7a;
    --rest: #3FB98A;
    --go: #2FD06B;            /* Start με hover / πάτημα / τηλεχειριστήριο */
    --go-text: #04240F;
    --warn: #F2A52B;
    --font-display: "Helvetica Neue", "Arial Nova", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    --chamfer: 14px;          /* κομμένες γωνίες σαν την ασπίδα */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); overscroll-behavior: none; }
  #root {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% 35%, #1a1a1a 0%, var(--bg) 65%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 20px 40px;
    position: relative;
    overflow: hidden;
    font-family: var(--font-display);
    color: #f2f2f2;
  }

  /* Κεφαλίδα: λογότυπο + όνομα, όπως στα posts του συλλόγου. */
  .brand-bar {
    position: relative; z-index: 2;
    width: 100%; max-width: 850px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    padding-bottom: 16px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { height: 52px; width: auto; display: block; }
  .brand-name {
    font-size: 26px; font-weight: 900; line-height: 1;
    letter-spacing: 0.02em; text-transform: uppercase;
  }
  .brand-sub, .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--muted);
  }
  .brand-sub { margin-top: 6px; }

  .live-clock-container { text-align: right; }
  .live-time {
    font-size: clamp(28px, 6vw, 40px);
    line-height: 1;
    font-weight: 800;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .live-date {
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.18em;
    color: var(--muted);
    margin-top: 6px;
    text-transform: uppercase;
  }

  #logo-bg {
    position: absolute; top: 52%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(90vw, 560px); height: min(90vw, 560px);
    opacity: 0.09;
    pointer-events: none;
    z-index: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #logo-bg img { width: 100%; height: 100%; object-fit: contain; }
  .content { position: relative; z-index: 1; width: 100%; max-width: 850px; }

  .timer-display { text-align: center; margin-bottom: 30px; }
  .round-label {
    font-family: var(--font-mono);
    font-size: 15px;
    color: #bdbdbd;
    letter-spacing: 0.3em;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .big-time {
    font-size: clamp(110px, 27vw, 200px);
    font-weight: 900;
    line-height: 0.92;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
  }
  .big-time.warning { color: var(--warn); }
  .big-time.resting { color: var(--rest); }
  .big-time.countdown { color: #8d8d8d; }

  .phase-badge {
    display: inline-block;
    margin-top: 18px;
    padding: 9px 26px;
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    background: #161616;
    color: var(--muted);
    border: 1px solid #333;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    padding-left: 30px; padding-right: 30px;
  }
  .phase-badge.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .phase-badge.resting { background: #0d2a20; color: var(--rest); border-color: #1f6b50; }
  .phase-badge.countdown { background: #1c1c1c; color: #d0d0d0; border-color: #444; }
  .phase-badge.warning { background: var(--warn); color: #2a1a00; border-color: var(--warn); }

  /* Κουκκίδες γύρων σε σχήμα ασπίδας. */
  .rounds-row {
    display: flex; flex-wrap: wrap;
    align-items: center; justify-content: center;
    gap: 10px;
    margin-bottom: 36px;
  }
  .round-dot {
    width: 16px; height: 19px;
    background: #2a2a2a;
    clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%);
    transition: all 0.3s;
  }
  .round-dot.done { background: var(--accent-deep); }
  .round-dot.current { background: var(--accent); width: 22px; height: 26px; }

  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    margin-bottom: 36px;
  }
  .setting-card {
    background: var(--panel);
    padding: 20px 12px;
    text-align: center;
    clip-path: polygon(0 0, calc(100% - var(--chamfer)) 0, 100% var(--chamfer), 100% 100%, var(--chamfer) 100%, 0 calc(100% - var(--chamfer)));
    border-top: 2px solid #2f2f2f;
  }
  .setting-card label {
    display: block;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .setting-card .val-display {
    font-size: 38px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }
  .setting-card .val-display span { font-size: 16px; color: var(--muted); font-weight: 700; margin-left: 2px; }

  .stepper { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .stepper button {
    width: 46px; height: 42px;
    background: #1c1c1c;
    border: 1px solid #333;
    color: #ddd;
    font-size: 24px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
    padding: 0;
    border-radius: 2px;
  }
  .stepper button:hover { background: #fff; color: #0a0a0a; }
  .stepper button:active { transform: scale(0.95); }

  .controls { display: flex; gap: 16px; justify-content: center; margin-bottom: 28px; }
  .btn-main, .btn-stop {
    height: 70px;
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    transition: background 0.15s, color 0.15s;
    clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
  }
  .btn-main { padding: 0 64px; min-width: 240px; }
  .btn-start { background: var(--accent); color: var(--accent-text); }
  /* Πράσινο όταν το ποντίκι είναι από πάνω, όταν το πατάει το δάχτυλο (κινητό)
     ή όταν το επιλέγει το τηλεχειριστήριο (focus στην τηλεόραση). */
  /* Ξεχωριστοί κανόνες: παλιοί browsers τηλεόρασης πετάνε ολόκληρο τον κανόνα αν
     δεν καταλαβαίνουν έναν selector (π.χ. :focus-visible). */
  .btn-start:hover { background: var(--go); color: var(--go-text); }
  .btn-start:active { background: var(--go); color: var(--go-text); }
  .btn-start:focus { background: var(--go); color: var(--go-text); outline: none; }
  /* Νέοι browsers: μετά από κλικ με ποντίκι να μη μένει πράσινο. Οι παλιοί αγνοούν
     αυτόν τον κανόνα, άρα εκεί το focus του τηλεχειριστηρίου μένει πράσινο. */
  .btn-start:focus:not(:focus-visible):not(:hover):not(:active) { background: var(--accent); color: var(--accent-text); }
  .btn-pause { background: var(--warn); color: #2a1a00; }
  .btn-pause:hover { background: #d18a1c; }
  .btn-stop { padding: 0 42px; background: #1c1c1c; color: #aaa; font-size: 18px; }
  .btn-stop:hover { background: #2a1414; color: #E8603A; }
  .btn-main:active, .btn-stop:active { transform: scale(0.97); }

  .sound-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 6px; }
  .sound-row label, .sound-row span {
    font-family: var(--font-mono);
    font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--muted);
  }
  .toggle-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .toggle-wrap input[type=checkbox] { width: 44px; height: 24px; accent-color: var(--accent); cursor: pointer; }

  .footer-tag {
    margin-top: 34px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase;
    color: #4a4a4a;
  }

  /* Κινητά: τα τρία κουτιά ρυθμίσεων πρέπει να χωράνε σε στενή οθόνη. */
  @media (max-width: 480px) {
    #root { padding: 14px 14px 30px; }
    .brand img { height: 40px; }
    .brand-name { font-size: 20px; }
    .brand-sub { font-size: 9px; letter-spacing: 0.24em; }
    .live-date { font-size: 9px; letter-spacing: 0.1em; }
    .settings-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 26px;
    }
    .setting-card { padding: 14px 6px; --chamfer: 10px; }
    .setting-card label { font-size: 10px; letter-spacing: 0.14em; margin-bottom: 8px; }
    .setting-card .val-display { font-size: 26px; margin-bottom: 10px; }
    .setting-card .val-display span { font-size: 12px; }
    .stepper { gap: 6px; }
    .stepper button { width: 36px; height: 36px; font-size: 20px; }
    .controls { gap: 10px; }
    .btn-main { padding: 0 34px; min-width: 0; font-size: 20px; }
    .btn-stop { padding: 0 26px; font-size: 16px; }
    .round-label { font-size: 13px; letter-spacing: 0.22em; }
    .phase-badge { font-size: 13px; }
  }
</style>

<div id="root">
  <div class="brand-bar">
    <div class="brand">
      <img src="logo.png" alt="FT BJJ logo" onerror="this.style.display='none';">
      <div>
        <div class="brand-name">FT BJJ</div>
        <div class="brand-sub">Jiu-Jitsu · Limassol</div>
      </div>
    </div>
    <div class="live-clock-container">
      <div class="live-time" id="live-time">00:00:00</div>
      <div class="live-date" id="live-date">Monday 1 January</div>
    </div>
  </div>

  <div id="logo-bg">
    <img src="logo.png" alt="" onerror="this.style.display='none';">
  </div>

  <div class="content">
    <div class="timer-display">
      <div class="round-label" id="round-label">Round 01 / 05</div>
      <div class="big-time" id="big-time">05:00</div>
      <div class="phase-badge" id="phase-badge">Ready</div>
    </div>

    <div class="rounds-row" id="rounds-row"></div>

    <div class="settings-grid">
      <div class="setting-card">
        <label>Rounds</label>
        <div class="val-display" id="disp-rounds">5</div>
        <div class="stepper">
          <button onclick="adjust('rounds',-1)" aria-label="Fewer rounds">−</button>
          <button onclick="adjust('rounds',1)" aria-label="More rounds">+</button>
        </div>
      </div>
      <div class="setting-card">
        <label>Round</label>
        <div class="val-display" id="disp-round"><span>min</span></div>
        <div class="stepper">
          <button onclick="adjust('roundTime',-30)" aria-label="Shorter round">−</button>
          <button onclick="adjust('roundTime',30)" aria-label="Longer round">+</button>
        </div>
      </div>
      <div class="setting-card">
        <label>Rest</label>
        <div class="val-display" id="disp-rest"><span>sec</span></div>
        <div class="stepper">
          <button onclick="adjust('restTime',-5)" aria-label="Shorter rest">−</button>
          <button onclick="adjust('restTime',5)" aria-label="Longer rest">+</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-main btn-start" id="btn-main" onclick="handleMain()">Start</button>
      <button class="btn-stop" id="btn-stop" onclick="handleStop()">Reset</button>
    </div>

    <div class="sound-row">
      <label for="sound-toggle">Sounds</label>
      <label class="toggle-wrap">
        <input type="checkbox" id="sound-toggle" checked>
        <span>On</span>
      </label>
    </div>

    <div class="footer-tag">FT BJJ · Limassol · Cyprus</div>
  </div>
</div>

<script>
const state = {
  rounds: 5,
  roundTime: 300,
  restTime: 60,
  currentRound: 1,
  phase: 'idle',
  timeLeft: 300,
  paused: false,
  interval: null,
  warned: false
};

// Αρχεία ήχου: αποκωδικοποιούνται μία φορά σε μνήμη (Web Audio API) ώστε η αναπαραγωγή
// να ξεκινάει ακαριαία, χωρίς seek/buffering που έκοβε τον ήχο σε αργές τηλεοράσεις.
const soundFiles = { go: "go.mp3", soon: "soon.mp3", ready: "ready.mp3", finish: "finish.mp3" };
const soundBuffers = {};
// Εφεδρικά <audio> στοιχεία: χρησιμοποιούνται αν το fetch αποτύχει (π.χ. όταν το
// αρχείο ανοίγει τοπικά με file://, όπου ο browser μπλοκάρει το fetch).
const fallbackAudio = {};
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function preloadSounds() {
  const ctx = getAudioCtx();
  Object.entries(soundFiles).forEach(([name, file]) => {
    fetch(file)
      .then(res => res.arrayBuffer())
      .then(data => ctx.decodeAudioData(data))
      .then(buf => { soundBuffers[name] = buf; })
      .catch(e => {
        console.log("Sound load failed, using fallback:", name, e);
        const a = new Audio(file);
        a.preload = 'auto';
        fallbackAudio[name] = a;
      });
  });
}
preloadSounds();

// Ξεκλείδωμα audio context μετά από click/touch (απαιτείται από τους περισσότερους browsers/TV)
function unlockAudio() {
  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
}
document.body.addEventListener('touchstart', unlockAudio, { once: true });
document.body.addEventListener('click', unlockAudio, { once: true });

// Κεντρική λειτουργία αναπαραγωγής: κάθε κλήση δημιουργεί νέο, ανεξάρτητο source node
// ώστε διαδοχικοί/επικαλυπτόμενοι ήχοι να μην κόβουν ο ένας τον άλλον.
function playSound(name) {
  if (!document.getElementById('sound-toggle').checked) return;
  const buf = soundBuffers[name];
  if (!buf) {
    const fb = fallbackAudio[name];
    if (fb) fb.cloneNode().play().catch(() => {});
    return;
  }
  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
  const source = ctx.createBufferSource();
  source.buffer = buf;
  source.connect(ctx.destination);
  source.start(0);
}

// Ενημερωμένες Συναρτήσεις Ήχων
function soundStart() { playSound('go'); }
function soundEnd() { playSound('finish'); }
function soundWarn() { playSound('soon'); }
function soundReady() { playSound('ready'); }

// Wake Lock: η οθόνη δεν σβήνει όσο μετράει ο χρόνος. Δουλεύει μόνο σε https
// (ή localhost) — σε παλιότερους browsers απλά αγνοείται.
let wakeLock = null;
let wakeLockPending = false;
let wakeLockBlocked = false;

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  if (wakeLock || wakeLockPending || wakeLockBlocked) return;
  // Ο browser απορρίπτει το αίτημα όταν η σελίδα δεν είναι ορατή. Ξαναπροσπαθούμε
  // μόνο όταν επιστρέψει η σελίδα ή σε νέο Start — όχι κάθε δευτερόλεπτο.
  if (document.visibilityState !== 'visible') return;
  wakeLockPending = true;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) {
    wakeLockBlocked = true;
    console.log('Wake lock failed:', e && e.message);
  } finally {
    wakeLockPending = false;
  }
}

function releaseWakeLock() {
  if (!wakeLock) return;
  const wl = wakeLock;
  wakeLock = null;
  wl.release().catch(() => {});
}

function timerIsRunning() {
  return state.interval !== null && !state.paused &&
         state.phase !== 'idle' && state.phase !== 'done';
}

// Καλείται μετά από κάθε αλλαγή κατάστασης: ζητάει ή αφήνει το lock ανάλογα.
function syncWakeLock() {
  if (timerIsRunning()) requestWakeLock(); else releaseWakeLock();
}

// Το lock χάνεται όταν η σελίδα φύγει στο παρασκήνιο — το ξαναζητάμε στην επιστροφή.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  wakeLockBlocked = false;
  syncWakeLock();
});

// Service worker: επιτρέπει εγκατάσταση στην αρχική οθόνη και λειτουργία offline.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch(e => console.log('Service worker registration failed:', e));
  });
}

// Ρολόι και Ημερομηνία
function updateLiveClock() {
  const now = new Date();
  const hrs = String(now.getHours()).padStart(2, '0');
  const mins = String(now.getMinutes()).padStart(2, '0');
  const secs = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('live-time').textContent = hrs + ':' + mins + ':' + secs;
  
  const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  document.getElementById('live-date').textContent = now.toLocaleDateString('en-GB', options);
}
updateLiveClock();
setInterval(updateLiveClock, 1000);

// "Round 01 / 05", στο στυλ των posts του συλλόγου.
function roundOf(n) {
  const p = x => (x<10?'0':'')+x;
  return p(n)+' / '+p(state.rounds);
}

function fmt(s) {
  const m = Math.floor(s/60);
  const sec = s%60;
  return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}

function renderDots() {
  const row = document.getElementById('rounds-row');
  row.innerHTML = '';
  for (let i=1; i<=state.rounds; i++) {
    const d = document.createElement('div');
    d.className = 'round-dot';
    if (i < state.currentRound) d.classList.add('done');
    if (i === state.currentRound && state.phase !== 'idle') d.classList.add('current');
    row.appendChild(d);
  }
}

function renderSettings() {
  document.getElementById('disp-rounds').textContent = state.rounds;
  const rm = Math.floor(state.roundTime/60);
  const rs = state.roundTime%60;
  document.getElementById('disp-round').innerHTML = (rm>0?rm+'<span>m</span> ':'')+(rs>0?rs+'<span>s</span>':'');
  document.getElementById('disp-rest').innerHTML = state.restTime+'<span>s</span>';
}

function renderTimer() {
  const bt = document.getElementById('big-time');
  const pb = document.getElementById('phase-badge');
  const rl = document.getElementById('round-label');
  bt.textContent = fmt(state.timeLeft);
  bt.className = 'big-time';
  pb.className = 'phase-badge';

  if (state.phase === 'countdown') {
    bt.classList.add('countdown');
    pb.classList.add('countdown');
    pb.textContent = 'Starting in';
    rl.textContent = 'Get ready';
  } else if (state.phase === 'round') {
    if (state.timeLeft <= 10 && !state.paused) { bt.classList.add('warning'); pb.classList.add('warning'); pb.textContent = 'Warning — 10s'; }
    else { pb.classList.add('active'); pb.textContent = 'Round in progress'; }
    rl.textContent = 'Round '+roundOf(state.currentRound);
  } else if (state.phase === 'rest') {
    bt.classList.add('resting');
    pb.classList.add('resting');
    pb.textContent = 'Rest';
    rl.textContent = 'Next · Round '+roundOf(state.currentRound+1);
  } else if (state.phase === 'done') {
    bt.textContent = '00:00';
    pb.textContent = 'Done!';
    pb.classList.add('active');
    rl.textContent = 'All rounds complete';
  } else {
    pb.textContent = 'Ready';
    rl.textContent = 'Round '+roundOf(1);
    bt.textContent = fmt(state.roundTime);
  }
}

function updateMainBtn() {
  const btn = document.getElementById('btn-main');
  if (state.phase === 'idle') { btn.textContent = 'Start'; btn.className = 'btn-main btn-start'; }
  else if (state.paused) { btn.textContent = 'Resume'; btn.className = 'btn-main btn-start'; }
  else if (state.phase === 'done') { btn.textContent = 'Restart'; btn.className = 'btn-main btn-start'; }
  else { btn.textContent = 'Pause'; btn.className = 'btn-main btn-pause'; }
}

function adjust(key, delta) {
  if (state.phase !== 'idle') return;
  if (key === 'rounds') state.rounds = Math.max(1, Math.min(20, state.rounds+delta));
  if (key === 'roundTime') state.roundTime = Math.max(30, Math.min(1800, state.roundTime+delta));
  if (key === 'restTime') state.restTime = Math.max(0, Math.min(300, state.restTime+delta));
  state.timeLeft = state.roundTime;
  renderSettings();
  renderDots();
  renderTimer();
}

function tick() {
  if (state.paused) return;
  if (state.phase === 'countdown') {
    if (state.timeLeft > 0) {
      state.timeLeft--;
    } else {
      state.phase = 'round';
      state.timeLeft = state.roundTime;
      state.warned = false;
      soundStart();
    }
  } else if (state.phase === 'round') {
    if (state.timeLeft === 10 && !state.warned) {
      state.warned = true;
      soundWarn();
    }
    if (state.timeLeft > 0) {
      state.timeLeft--;
    } else {
      soundEnd();
      if (state.currentRound >= state.rounds) {
        state.phase = 'done';
        clearInterval(state.interval);
        state.interval = null;
      } else if (state.restTime > 0) {
        state.phase = 'rest';
        state.timeLeft = state.restTime;
      } else {
        state.currentRound++;
        state.phase = 'round';
        state.timeLeft = state.roundTime;
        state.warned = false;
        soundStart();
      }
    }
  } else if (state.phase === 'rest') {
    if (state.timeLeft > 0) {
      state.timeLeft--;
    } else {
      state.currentRound++;
      state.phase = 'countdown';
      state.timeLeft = 3;
      soundReady();
    }
  }
  renderTimer();
  renderDots();
  updateMainBtn();

  if (state.phase === 'done') {
    renderTimer(); renderDots(); updateMainBtn();
  }
  syncWakeLock();
}

function handleMain() {
  if (state.phase === 'idle' || state.phase === 'done') {
    state.currentRound = 1;
    state.phase = 'countdown';
    state.timeLeft = 3;
    state.warned = false;
    state.paused = false;
    wakeLockBlocked = false;
    if (state.interval) clearInterval(state.interval);
    state.interval = setInterval(tick, 1000);
    soundReady();
  } else {
    state.paused = !state.paused;
  }
  renderTimer(); renderDots(); updateMainBtn();
  syncWakeLock();
}

function handleStop() {
  if (state.interval) clearInterval(state.interval);
  state.interval = null;
  state.phase = 'idle';
  state.currentRound = 1;
  state.timeLeft = state.roundTime;
  state.paused = false;
  state.warned = false;
  renderTimer(); renderDots(); updateMainBtn();
  syncWakeLock();
}

renderSettings();
renderDots();
renderTimer();
updateMainBtn();
</script>
